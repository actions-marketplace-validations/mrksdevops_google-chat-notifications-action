name: 'Google Chat Notifications Webhook Action'
description: 'Google Chat Notifications for GitHub Actions'
author: 'mrksdevops'
inputs:
  title:
    description: 'Job title.'
    required: false
    default: 'Build'
  subtitle:
    description: 'Job subtitle. Recommended: github.event.head_commit.message. Special HTML characters are automatically escaped.'
    required: false
    default: ''
  webhookUrl:
    description: 'Google Chat Webhook URL.'
    required: true
  status:
    description: 'Job status: success, failure, or cancelled. Recommended: job.status.'
    required: true
  threadKey:
    description: 'Optional key to group messages into a single thread.'
    required: false
    default: ''
runs:
  using: 'node24'
  main: 'dist/index.js'
branding:
  icon: 'send'
  color: 'green'
